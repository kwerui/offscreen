<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offscreen</title>

    <style>
      :root {
        --bg: #0b0d12;
        --panel: #141821;
        --panel-2: #1c2230;
        --border: #262d3d;
        --text: #e6e9f2;
        --muted: #8b94a7;
        --accent: #5b8def;
        --accent-2: #4cc9a0;
        --danger: #ef5b5b;
        --user: #2a3a5c;
        --agent: #1f3530;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        max-width: 920px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
      }

      .dot.connecting {
        background: #e6c25b;
        animation: pulse 1.2s infinite;
      }

      .dot.connected {
        background: var(--accent-2);
      }

      .dot.error {
        background: var(--danger);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.35;
        }
      }

      .config {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      select,
      textarea {
        width: 100%;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        font-family: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 60px;
      }

      .config .full {
        grid-column: 1 / -1;
      }

      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }

      button {
        font: inherit;
        padding: 12px 18px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      button.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
        font-weight: 600;
      }

      .transcript {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        height: 460px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .empty {
        margin: auto;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }

      .bubble {
        max-width: 78%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 15px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user);
        border-bottom-right-radius: 4px;
      }

      .bubble.agent {
        align-self: flex-start;
        background: var(--agent);
        border-bottom-left-radius: 4px;
      }

      .bubble.partial {
        opacity: 0.6;
        font-style: italic;
      }

      .bubble .meta {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }

      footer {
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>Offscreen</h1>

        <span class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">Disconnected</span>
        </span>
      </header>

      <div class="config">
        <div>
          <label for="voice">Voice</label>

          <select id="voice">
            <option value="ivy">Ivy (US, professional)</option>
            <option value="james">James (US, conversational)</option>
            <option value="tyler">Tyler (US)</option>
            <option value="autumn">Autumn (US)</option>
            <option value="sam">Sam (US)</option>
            <option value="mia">Mia (US)</option>
            <option value="bella">Bella (US)</option>
            <option value="sophie">Sophie (UK female)</option>
            <option value="oliver">Oliver (UK male)</option>
            <option value="arjun">Arjun (Hindi/Hinglish)</option>
            <option value="pierre">Pierre (French)</option>
            <option value="lena">Lena (German)</option>
            <option value="diego">Diego (Spanish)</option>
            <option value="giulia">Giulia (Italian)</option>
            <option value="ren">Ren (Japanese)</option>
            <option value="mina">Mina (Korean)</option>
          </select>
        </div>

        <div>
          <label for="greeting">Greeting</label>

          <select id="greeting">
            <option value="Offscreen is ready. What can I do?">
              Default
            </option>
            <option value="Ready when you are.">
              Minimal
            </option>
            <option value="Hey — what should I handle?">
              Casual
            </option>
          </select>
        </div>

        <div class="full">
          <label for="prompt">System prompt</label>

          <textarea id="prompt">You are Offscreen, a voice-first computer companion.

Your purpose is to help the user complete routine digital tasks while reducing unnecessary screen and keyboard interaction.

Keep spoken responses brief and natural.

You can open supported websites using open_website.

You can access the user's real Google Calendar using get_calendar_events.

For EVERY question about the user's calendar, schedule, events, commitments, or availability, ALWAYS call get_calendar_events.

Calendar requests can be phrased casually or grammatically imperfectly. Do not require filler words such as "the", "on", or "this".

Treat all of these as calendar requests:

User: "What's my next event?"
Call get_calendar_events with when = "upcoming"

User: "What do I have today?"
Call get_calendar_events with when = "today"

User: "What do I have this month?"
Call get_calendar_events with when = "this month"

User: "What do I have September 23rd?"
Call get_calendar_events with when = "September 23rd"

User: "What do I have on September 23rd?"
Call get_calendar_events with when = "September 23rd"

User: "Am I free 28th?"
Call get_calendar_events with when = "28th"

User: "Am I free on 28th?"
Call get_calendar_events with when = "28th"

User: "Am I free on the 28th?"
Call get_calendar_events with when = "28th"

User: "What's on Friday?"
Call get_calendar_events with when = "Friday"

User: "Am I free on December 1st?"
Call get_calendar_events with when = "December 1st"

User: "Am I free on the 1st of December?"
Call get_calendar_events with when = "1st of December"

User: "What do I have on the 23rd of September?"
Call get_calendar_events with when = "23rd of September"

Dates may be spoken month-first or day-first. "December 1st" and "1st of December" mean the same kind of calendar request and must both call get_calendar_events.

If a user asks whether they are free, busy, available, or scheduled at any time or date, that is ALWAYS a calendar request.

Never answer a calendar question without first calling get_calendar_events.
Never invent calendar information.

Calendar dates may contain spoken ordinal words.

Examples:

User: "What do I have on the second of December?"
Call get_calendar_events with when = "second of December"

User: "What's on the twenty-ninth?"
Call get_calendar_events with when = "twenty-ninth"

Treat spoken forms such as first, second, third, twenty-eighth, and
twenty-ninth as dates just like 1st, 2nd, 3rd, 28th, and 29th.

CODEX TOOL ROUTING — REQUIRED

If the user mentions Codex, says "ask Codex", or asks to inspect, review,
debug, explain, or analyze this local repository or its code, you MUST call
ask_codex immediately in the same turn.

Do not ask for confirmation.
Do not ask what Codex should do if the user's request is already understandable.
Broad requests such as "do a reliability review" are valid tasks.
Do not say "I'll ask Codex", "one moment", "should I go ahead?", or otherwise
respond before calling the tool.

Pass the user's actual request to ask_codex as the task.

Examples:

User: "Ask Codex what this project does."
→ immediately call ask_codex

User: "Ask Codex for a deep reliability review."
→ immediately call ask_codex with task = "Perform a deep reliability review."

User: "Ask Codex to inspect the project architecture and identify the most
important reliability issue."
→ immediately call ask_codex with that request as the task

User: "Go ahead."
→ if the immediately preceding conversation established a Codex task that has
not yet been executed, call ask_codex with that task immediately.

Never claim Codex is working unless ask_codex has actually been called.
After the tool returns, summarize its result briefly.
</textarea>
        </div>
      </div>

      <div class="controls">
        <button class="primary" id="connect">Connect</button>
        <button class="danger" id="disconnect" disabled>
          Disconnect
        </button>
        <button id="clear">Clear transcript</button>
      </div>

      <div class="transcript" id="transcript">
        <div class="empty" id="empty">
          Configure your voice and prompt above, then press Connect.
        </div>
      </div>

      <footer>
        Powered by
        <a
          href="https://www.assemblyai.com/docs/voice-agents/voice-agent-api"
          target="_blank"
          rel="noreferrer"
        >
          AssemblyAI Voice Agent API
        </a>.
      </footer>
    </div>

    <script>
      const SAMPLE_RATE = 24_000;
      const WS_URL =
        "wss://agents.assemblyai.com/v1/ws";

      const SITE_URLS = {
        github: "https://github.com",
        youtube: "https://youtube.com",
        assemblyai: "https://www.assemblyai.com/docs",
        gmail: "https://mail.google.com",
        calendar: "https://calendar.google.com",
      };

      const els = {
        connect: document.getElementById("connect"),
        disconnect: document.getElementById("disconnect"),
        clear: document.getElementById("clear"),
        voice: document.getElementById("voice"),
        prompt: document.getElementById("prompt"),
        greeting: document.getElementById("greeting"),
        transcript: document.getElementById("transcript"),
        empty: document.getElementById("empty"),
        statusDot: document.getElementById("status-dot"),
        statusText: document.getElementById("status-text"),
      };

      let ws = null;
      let audioCtx = null;
      let micStream = null;
      let workletNode = null;
      let micSource = null;
      let activeSessionId = 0;

      let playbackTime = 0;
      let scheduledSources = [];
      let userPartialEl = null;

      let pendingToolResults = [];
      let activeToolTasks = 0;
      let toolReplyDone = false;
      let activeToolTurnId = 0;

      let toolStatusElement = null;
let toolStatusTimer = null;
let toolStatusStartedAt = null;
let toolStatusSessionId = null;
let toolStatusTurnId = null;

      function setStatus(state, text) {
        els.statusDot.className = "dot " + state;
        els.statusText.textContent = text;
      }

      function isActiveSession(sessionId) {
        return sessionId === activeSessionId;
      }

      function isActiveToolTurn(sessionId, toolTurnId) {
        return (
          isActiveSession(sessionId) &&
          toolTurnId === activeToolTurnId
        );
      }

      function invalidateToolTurn() {
        activeToolTurnId++;
        pendingToolResults = [];
        activeToolTasks = 0;
        toolReplyDone = false;
        clearToolStatus();
      }



      function endActiveSession(statusState = "", statusText = "Disconnected") {
        activeSessionId++;
        teardown(statusState, statusText);
      }

      function clearTranscript() {
        els.transcript.innerHTML = "";
        els.transcript.appendChild(els.empty);
        userPartialEl = null;
      }

      function ensureBubble(role, partial = false) {
        if (els.empty.parentNode) {
          els.empty.remove();
        }

        const div = document.createElement("div");

        div.className =
          "bubble " +
          role +
          (partial ? " partial" : "");

        els.transcript.appendChild(div);
        els.transcript.scrollTop =
          els.transcript.scrollHeight;

        return div;
      }

      function addBubble(role, text, meta) {
        const div = ensureBubble(role);

        div.textContent = text;

        if (meta) {
          const span =
            document.createElement("span");

          span.className = "meta";
          span.textContent = meta;

          div.appendChild(span);
        }

        els.transcript.scrollTop =
          els.transcript.scrollHeight;
      }

      async function fetchToken() {
        const response =
          await fetch("/api/voice-token");

        if (!response.ok) {
          throw new Error(
            "Failed to fetch token: " +
              response.status
          );
        }

        const { token } =
          await response.json();

        return token;
      }

      async function connect() {
        const sessionId = activeSessionId + 1;

        if (ws || audioCtx || micStream) {
          activeSessionId = sessionId;
          teardown();
        } else {
          activeSessionId = sessionId;
        }

        els.connect.disabled = true;

        setStatus(
          "connecting",
          "Requesting token…"
        );

        let token;

        try {
          token = await fetchToken();
        } catch (err) {
          if (!isActiveSession(sessionId)) {
            return;
          }

          console.error(err);

          endActiveSession("error", "Token error");

          return;
        }

        if (!isActiveSession(sessionId)) {
          return;
        }

        let connectionAudioContext;

        try {
          connectionAudioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
          )({
            sampleRate: SAMPLE_RATE,
          });
        } catch (err) {
          console.error("Audio context error:", err);
          endActiveSession("error", "Audio setup error");
          return;
        }

        if (!isActiveSession(sessionId)) {
          closeAudioContext(connectionAudioContext);
          return;
        }

        audioCtx = connectionAudioContext;

        playbackTime =
          connectionAudioContext.currentTime;

        scheduledSources = [];

        try {
          const capturedMicrophoneStream =
            await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                channelCount: 1,
              },
            });

          if (!isActiveSession(sessionId)) {
            stopMicrophoneTracks(capturedMicrophoneStream);
            return;
          }

          micStream = capturedMicrophoneStream;
        } catch (err) {
          if (!isActiveSession(sessionId)) {
            return;
          }

          console.error(
            "Mic permission denied:",
            err
          );

          endActiveSession(
            "error",
            "Mic blocked"
          );

          return;
        }

        try {
          await connectionAudioContext.audioWorklet.addModule(
            "pcm-processor.js"
          );
        } catch (err) {
          if (!isActiveSession(sessionId)) {
            return;
          }

          console.error("AudioWorklet load error:", err);
          endActiveSession("error", "Audio setup error");
          return;
        }

        if (!isActiveSession(sessionId)) {
          return;
        }

        try {
          micSource =
            connectionAudioContext.createMediaStreamSource(
              micStream
            );

          workletNode =
            new AudioWorkletNode(
              connectionAudioContext,
              "pcm-processor"
            );
        } catch (err) {
          console.error("Audio node setup error:", err);
          endActiveSession("error", "Audio setup error");
          return;
        }

        setStatus(
          "connecting",
          "Connecting…"
        );

        let connectionSocket;

        try {
          connectionSocket = new WebSocket(
            `${WS_URL}?token=${encodeURIComponent(
              token
            )}`
          );
        } catch (err) {
          console.error("WebSocket setup error:", err);
          endActiveSession("error", "Connection error");
          return;
        }

        if (!isActiveSession(sessionId)) {
          closeWebSocket(connectionSocket);
          return;
        }

        ws = connectionSocket;

        connectionSocket.binaryType = "arraybuffer";

        connectionSocket.onopen = () => {
          if (!isActiveSession(sessionId)) {
            closeWebSocket(connectionSocket);
            return;
          }

          const now = new Date();

          const today = [
            now.getFullYear(),
            String(
              now.getMonth() + 1
            ).padStart(2, "0"),
            String(
              now.getDate()
            ).padStart(2, "0"),
          ].join("-");

          connectionSocket.send(
            JSON.stringify({
              type: "session.update",

              session: {
                system_prompt:
                  els.prompt.value +
                  `\n\nToday's date is ${today}. Use this to interpret relative calendar dates such as Friday, Wednesday, or the 28th.`,

                greeting:
                  els.greeting.value,

                input: {
  turn_detection: {
    vad_threshold: 0.5,
    min_silence: 1000,
    max_silence: 3000,
    interrupt_response: true,
  },
},

                output: {
                  voice:
                    els.voice.value,
                },

                tools: [
                  {
                    type: "function",

                    name:
                      "open_website",

                    description:
                      "Open one of the supported websites in the user's browser.",

                    parameters: {
                      type: "object",

                      properties: {
                        site: {
                          type:
                            "string",

                          enum: [
                            "github",
                            "youtube",
                            "assemblyai",
                            "gmail",
                            "calendar",
                          ],

                          description:
                            "The supported website to open.",
                        },
                      },

                      required: [
                        "site",
                      ],
                    },
                  },

{
  type: "function",
  name: "get_calendar_events",
description:
  "Check the user's real Google Calendar. ALWAYS call this for ANY question " +
  "about the user's schedule, events, commitments, availability, being free " +
  "or busy, or any named date/day. Dates may use numeric or spoken ordinals, " +
  "for example '2nd of December', 'second of December', 'December 2nd', " +
  "'28th', 'twenty-ninth', or 'Friday'.",
  parameters: {
    type: "object",
    properties: {
      when: {
        type: "string",
description:
  "The requested time period or date, for example upcoming, today, tomorrow, this month, September 23rd, 23rd of September, December 1st, 1st of December, 28th, or Friday.",
      },
    },
    required: ["when"],
  },

  execution_mode: "hold",
  timeout_seconds: 15,
},

{
  type: "function",

  name: "ask_codex",

  description:
    "Use Codex to inspect the user's local software project. " +
    "Call this immediately whenever the user explicitly asks Codex " +
    "to inspect, review, debug, explain, or analyze the project or its code. " +
    "Do not ask for confirmation when the request is understandable.",

  parameters: {
    type: "object",

    properties: {
      task: {
        type: "string",

        description:
          "The complete request to send to Codex. " +
          "Preserve the user's actual request as closely as possible.",
      },
    },

    required: ["task"],
  },

  execution_mode: "interactive",
  timeout_seconds: 45,
}
                ],
              },
            })
          );
        };

        connectionSocket.onmessage = (event) => {
          if (!isActiveSession(sessionId)) {
            return;
          }

          handleEvent(
            JSON.parse(
              event.data
            ),
            sessionId
          );
        };

        connectionSocket.onerror = (err) => {
          if (!isActiveSession(sessionId)) {
            return;
          }

          console.error(
            "WebSocket error:",
            err
          );

          endActiveSession(
            "error",
            "Connection error"
          );
        };

        connectionSocket.onclose = (event) => {
          if (!isActiveSession(sessionId)) {
            return;
          }

          console.log(
            "WebSocket closed:",
            event.code,
            event.reason
          );

          endActiveSession();
        };

        workletNode.port.onmessage = (
          event
        ) => {
          if (
            !isActiveSession(sessionId) ||
            ws !== connectionSocket ||
            connectionSocket.readyState !==
              WebSocket.OPEN
          ) {
            return;
          }

          const audio =
            arrayBufferToBase64(
              event.data
            );

          connectionSocket.send(
            JSON.stringify({
              type: "input.audio",
              audio,
            })
          );
        };
      }

      function handleEvent(event, sessionId) {
        if (!isActiveSession(sessionId)) {
          return;
        }

        if (
          event.type !==
          "reply.audio"
        ) {
          console.log(
            "AssemblyAI event:",
            event
          );
        }

        switch (event.type) {
          case "session.ready":
            console.log(
              "READY TOOLS:",
              JSON.stringify(
                event.config?.tools,
                null,
                2
              )
            );

            setStatus(
              "connected",
              `Connected (${event.session_id})`
            );

            els.disconnect.disabled =
              false;

            micSource.connect(
              workletNode
            );

            break;

          case "session.updated":
            console.log(
              "Session configuration applied."
            );

            console.log(
              "SESSION TOOLS:",
              JSON.stringify(
                event.config?.tools,
                null,
                2
              )
            );

            break;

          case "input.speech.started":
            toolReplyDone = false;
            break;

          case "transcript.user.delta":
            if (!userPartialEl) {
              userPartialEl =
                ensureBubble(
                  "user",
                  true
                );
            }

            userPartialEl.textContent =
              event.text;

            els.transcript.scrollTop =
              els.transcript.scrollHeight;

            break;

          case "transcript.user":  if (event.text?.trim()) {
    invalidateToolTurn();
  }

  if (userPartialEl) {
              userPartialEl.classList.remove(
                "partial"
              );

              userPartialEl.textContent =
                event.text;

              userPartialEl = null;
            } else {
              addBubble(
                "user",
                event.text
              );
            }

            break;

          case "reply.started":
            toolReplyDone = false;
            break;

          case "reply.audio":
            playPCM(
              event.data,
              sessionId
            );
            break;

          case "transcript.agent": {
            const meta =
              event.interrupted
                ? "interrupted"
                : null;

            addBubble(
              "agent",
              event.text,
              meta
            );

            break;
          }

          case "tool.call":  const toolTurnId = activeToolTurnId;

  activeToolTasks++;

            handleToolCall(event, sessionId, toolTurnId)
              .catch((err) => {
                console.error(
                  "Tool handler failed:",
                  err
                );
              })
              .finally(() => {
                if (!isActiveToolTurn(sessionId, toolTurnId)) {
                  return;
                }

                activeToolTasks--;

                maybeSendToolResults(sessionId, toolTurnId);
              });

            break;

          case "reply.done":
            if (
              event.status ===
              "interrupted"
            ) {
              flushPlayback();

              invalidateToolTurn();
            } else {
              toolReplyDone = true;

              maybeSendToolResults(sessionId, activeToolTurnId);
            }

            break;

          case "session.error":
            console.error(
              "Session error:",
              event
            );

            setStatus(
              "error",
              `${event.code}: ${event.message}`
            );

            break;
        }
      }

      async function handleToolCall(
        event,
        sessionId,
        toolTurnId
      ) {
        console.log(
          "TOOL CALLED:",
          event.name,
          event.arguments
        );

        // ---------------------------------
        // OPEN WEBSITE
        // ---------------------------------

        if (
          event.name ===
          "open_website"
        ) {
          const site =
            event.arguments?.site;

          const url =
            SITE_URLS[site];

          if (!url) {
            addToolResult(sessionId, toolTurnId, event.call_id, {
              success: false,
              error: `Unsupported website: ${site}`,
            });

            return;
          }

          try {
            console.log(
              `Opening ${site}:`,
              url
            );

            const openedWindow =
              window.open(
                url,
                "_blank"
              );

            if (!openedWindow) {
              throw new Error(
                "The browser blocked the new tab."
              );
            }

            addToolResult(sessionId, toolTurnId, event.call_id, {
              success: true,
              site,
              url,
            });
          } catch (err) {
            addToolResult(sessionId, toolTurnId, event.call_id, {
              success: false,
              error: err.message,
            });
          }

          return;
        }

        // ---------------------------------
        // GOOGLE CALENDAR
        // ---------------------------------

        if (event.name === "get_calendar_events") {
  try {
    const when = event.arguments?.when;

    if (!when) {
      throw new Error(
        "Calendar time period is required."
      );
    }

    console.log("CALENDAR TOOL FIRED!");
    console.log("Requested time:", when);

    const response = await fetch(
      `/api/calendar/query?when=${encodeURIComponent(when)}`
    );

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        `Calendar request failed with status ${response.status}: ${errorText}`
      );
    }

    const data = await response.json();

    console.log("Calendar result:", data);

    addToolResult(sessionId, toolTurnId, event.call_id, {
      success: true,
      requested_when: when,
      timezone: data.timezone,
      events: data.events || [],
    });
  } catch (err) {
    console.error("Calendar tool failed:", err);

    addToolResult(sessionId, toolTurnId, event.call_id, {
      success: false,
      error: err.message,
    });
  }

  return;
}
// ---------------------------------
// CODEX
// ---------------------------------

if (event.name === "ask_codex") {
  try {
    const task = event.arguments?.task;

    if (!task) {
      throw new Error("Codex task is required.");
    }

    console.log("CODEX TOOL FIRED!");
    console.log("Codex task:", task);

    showToolStatus(
  "Codex is checking your project…",
  sessionId,
  toolTurnId
);

    const response = await fetch("/api/codex", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ task }),
    });

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        `Codex request failed with status ${response.status}: ${errorText}`
        
      );
    }

    const data = await response.json();
    clearToolStatus(sessionId, toolTurnId);
    console.log("Codex result:", data.output);

    addToolResult(sessionId, toolTurnId, event.call_id, {
      success: true,
      output: data.output,
    });
  } catch (err) {
    clearToolStatus(sessionId, toolTurnId);
    console.error("Codex tool failed:", err);

    addToolResult(sessionId, toolTurnId, event.call_id, {
      success: false,
      error: err.message,
    });
  }

  return;
}

// ---------------------------------
// UNKNOWN TOOL
// ---------------------------------

addToolResult(sessionId, toolTurnId, event.call_id, {
  success: false,
  error: `Unknown tool: ${event.name}`,
});

      }


      function addToolResult(sessionId, toolTurnId, callId, result) {
        if (!isActiveToolTurn(sessionId, toolTurnId)) {
          return;
        }

        pendingToolResults.push({
          call_id: callId,
          result,
        });
      }

      function maybeSendToolResults(sessionId, toolTurnId) {
        if (!isActiveToolTurn(sessionId, toolTurnId)) {
          return;
        }

        if (!toolReplyDone) {
          return;
        }

        if (
          activeToolTasks > 0
        ) {
          return;
        }

        if (
          pendingToolResults.length ===
          0
        ) {
          return;
        }

        console.log(
          "Sending tool results:",
          pendingToolResults
        );

        sendPendingToolResults(sessionId, toolTurnId);

        toolReplyDone = false;
      }

      function sendPendingToolResults(sessionId, toolTurnId) {
        if (
          !isActiveToolTurn(sessionId, toolTurnId) ||
          !ws ||
          ws.readyState !==
            WebSocket.OPEN
        ) {
          return;
        }

        for (
          const tool of
          pendingToolResults
        ) {
          sendToolResult(
            sessionId,
            toolTurnId,
            tool.call_id,
            tool.result
          );
        }

        pendingToolResults = [];
      }

      function sendToolResult(sessionId, toolTurnId, callId, result) {
        if (
          !isActiveToolTurn(sessionId, toolTurnId) ||
          !ws ||
          ws.readyState !== WebSocket.OPEN
        ) {
          return false;
        }

        ws.send(
          JSON.stringify({
            type: "tool.result",
            call_id: callId,
            result: JSON.stringify(result),
          })
        );

        return true;
      }

      function showToolStatus(message, sessionId, toolTurnId) {
  if (!isActiveToolTurn(sessionId, toolTurnId)) {
    return;
  }

  clearToolStatus();

  toolStatusStartedAt = Date.now();
  toolStatusSessionId = sessionId;
  toolStatusTurnId = toolTurnId;

  toolStatusElement = ensureBubble(
    "agent",
    true
  );

  function updateStatus() {
    if (
      !isActiveToolTurn(sessionId, toolTurnId) ||
      toolStatusSessionId !== sessionId ||
      toolStatusTurnId !== toolTurnId
    ) {
      return;
    }

    const seconds = Math.floor(
      (Date.now() - toolStatusStartedAt) / 1000
    );

    toolStatusElement.textContent =
      `${message} ${seconds}s`;
  }

  updateStatus();

  toolStatusTimer = setInterval(
    updateStatus,
    1000
  );
}

function clearToolStatus(sessionId, toolTurnId) {
  if (
    sessionId !== undefined &&
    toolStatusSessionId !== sessionId
  ) {
    return;
  }

  if (
    toolTurnId !== undefined &&
    toolStatusTurnId !== toolTurnId
  ) {
    return;
  }

  if (toolStatusTimer) {
    clearInterval(toolStatusTimer);
    toolStatusTimer = null;
  }

  if (toolStatusElement) {
    toolStatusElement.remove();
    toolStatusElement = null;
  }

  toolStatusStartedAt = null;
  toolStatusSessionId = null;
  toolStatusTurnId = null;
}

      function playPCM(b64, sessionId) {
        const bytes =
          Uint8Array.from(
            atob(b64),
            (char) =>
              char.charCodeAt(0)
          );

        const int16 =
          new Int16Array(
            bytes.buffer,
            bytes.byteOffset,
            bytes.byteLength / 2
          );

        const float32 =
          new Float32Array(
            int16.length
          );

        for (
          let i = 0;
          i < int16.length;
          i++
        ) {
          float32[i] =
            int16[i] /
            0x8000;
        }

        const buffer =
          audioCtx.createBuffer(
            1,
            float32.length,
            SAMPLE_RATE
          );

        buffer
          .getChannelData(0)
          .set(float32);

        const source =
          audioCtx.createBufferSource();

        source.buffer =
          buffer;

        source.connect(
          audioCtx.destination
        );

        const now =
          audioCtx.currentTime;

        if (
          playbackTime < now
        ) {
          playbackTime = now;
        }

        source.start(
          playbackTime
        );

        playbackTime +=
          buffer.duration;

        scheduledSources.push(
          source
        );

        source.onended = () => {
          if (!isActiveSession(sessionId)) {
            return;
          }

          scheduledSources =
            scheduledSources.filter(
              (item) =>
                item !== source
            );
        };
      }

      function flushPlayback() {
        for (
          const source of
          scheduledSources
        ) {
          try {
            source.stop();
          } catch (_) {}
        }

        scheduledSources = [];

        if (audioCtx) {
          playbackTime =
            audioCtx.currentTime;
        }
      }

      function teardown(statusState = "", statusText = "Disconnected") {
        const socket = ws;
        const audioContext = audioCtx;
        const microphoneStream = micStream;
        const processor = workletNode;
        const microphoneSource = micSource;

        invalidateToolTurn();
        flushPlayback();

        ws = null;
        audioCtx = null;
        micStream = null;
        workletNode = null;
        micSource = null;

        closeWebSocket(socket);
        disconnectAudioNode(processor);
        disconnectAudioNode(microphoneSource);
        stopMicrophoneTracks(microphoneStream);
        closeAudioContext(audioContext);

        userPartialEl = null;

        setStatus(statusState, statusText);

        els.connect.disabled =
          false;

        els.disconnect.disabled =
          true;
      }

      function disconnect() {
        endActiveSession();
      }

      function closeWebSocket(socket) {
        if (
          !socket ||
          socket.readyState === WebSocket.CLOSING ||
          socket.readyState === WebSocket.CLOSED
        ) {
          return;
        }

        try {
          socket.close();
        } catch (err) {
          console.error("WebSocket close error:", err);
        }
      }

      function disconnectAudioNode(audioNode) {
        if (!audioNode) {
          return;
        }

        try {
          audioNode.disconnect();
        } catch (err) {
          console.error("Audio node disconnect error:", err);
        }
      }

      function stopMicrophoneTracks(stream) {
        if (!stream) {
          return;
        }

        for (const track of stream.getTracks()) {
          try {
            track.stop();
          } catch (err) {
            console.error("Microphone track stop error:", err);
          }
        }
      }

      function closeAudioContext(audioContext) {
        if (!audioContext || audioContext.state === "closed") {
          return;
        }

        audioContext.close().catch((err) => {
          console.error("Audio context close error:", err);
        });
      }

      function arrayBufferToBase64(
        buffer
      ) {
        const bytes =
          new Uint8Array(
            buffer
          );

        let binary = "";

        const chunk =
          0x8000;

        for (
          let i = 0;
          i < bytes.length;
          i += chunk
        ) {
          binary +=
            String.fromCharCode.apply(
              null,
              bytes.subarray(
                i,
                i + chunk
              )
            );
        }

        return btoa(binary);
      }

      els.connect.addEventListener(
        "click",
        connect
      );

      els.disconnect.addEventListener(
        "click",
        disconnect
      );

      els.clear.addEventListener(
        "click",
        clearTranscript
      );
